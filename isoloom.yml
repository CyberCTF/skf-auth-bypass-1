# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Authentication Bypass (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask login whose session cookie is just a hash of the user name (authentication bypass). The SKF lab folder python/Auth-bypass-1 is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-auth-bypass-1

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.145.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    ports: { web: { port: 5000, protocol: http, publish: 5050 } }
    resources: { cpus: 1, memory_mb: 256 }
    files:
      # The player's flag, placed at each start where the old init script wrote it;
      # without the input the inert dev placeholder.
      - path: /ctf/flag
        input: CTF_FLAG_MAIN
        mode: "0444"
    app:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the login form posts to /login and registration is open
    script: checks/login.sh

message: |
  OWASP SKF Authentication Bypass answers at {{ machines.web.ports.web.url }}.
  Register a user, log in and look at the session cookie you get.
